<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Prep · Stats</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1714" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<nav class="topbar">
  <div class="brand">
    <svg class="brand-mark" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect class="brand-tile" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.5"/><path d="M11 34 H53" stroke="#F2EBDF" stroke-opacity=".5" stroke-width="3" stroke-dasharray="4 4"/><path d="M12 47 L23 39 L31 43 L43 27" fill="none" stroke="#E5845A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46.6 22.2 L53 13.7" fill="none" stroke="#E5845A" stroke-width="5" stroke-linecap="round" stroke-dasharray="2.5 5.5" stroke-opacity=".85"/></svg>
    <span class="brand-name">Exam Prep</span>
  </div>
  <div class="navlinks">
    <a href="/practice">Practice</a>
    <a href="/" aria-current="page">Stats</a>
  </div>
  <div class="tabs" role="tablist" aria-label="Exam">
    <button type="button" role="tab" data-exam="fexam" id="tab-fexam" aria-selected="true">Foundations</button>
    <button type="button" role="tab" data-exam="pexam" id="tab-pexam" aria-selected="false">Professional</button>
  </div>
  <div class="tools">
    <span class="updated" id="updated" aria-live="polite"></span>
    <button type="button" class="icon-btn" id="refresh" aria-label="Refresh stats">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M15 9a6 6 0 1 1-1.8-4.3M15 3v3.5h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="icon-btn" id="theme" aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 11.2A6 6 0 0 1 6.8 3.5a6 6 0 1 0 7.7 7.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</nav>
<main id="app" class="page" aria-busy="true">
  <p class="loading">Loading your history…</p>
</main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
